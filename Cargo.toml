[package]
name = "mdedit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
ratatui-textarea = { version = "0.9", features = ["crossterm", "search"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", features = ["simd"] }
unicode-segmentation = "1.12"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "dump-load", "regex-fancy"] }
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
