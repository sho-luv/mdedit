[package]
name = "mdedit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
ratatui-textarea = { version = "0.8", features = ["crossterm"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
